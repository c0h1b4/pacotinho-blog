          else
            if ! LC_ALL=C grep -Eiq \
                '(^|[^[:alnum:]_])manifest[ _-]unknown([^[:alnum:]_]|$)' \
                "${inspect_error}" \
                && ! LC_ALL=C grep -Fqx -- "ERROR: ${source_tag}: not found" "${inspect_error}"; then
