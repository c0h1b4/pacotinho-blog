                  "buildx_version": os.environ["BUILDX_VERSION"],
                  "buildkit_image": os.environ["BUILDKIT_IMAGE"],
                  "buildkit_version": os.environ["BUILDKIT_VERSION"],
                  "dockerfile_frontend": os.environ["DOCKERFILE_FRONTEND"],
                  "node_image": os.environ["NODE_IMAGE"],
                  "docker_version": os.environ["DOCKER_VERSION"],
                  "dockerfile_sha256": os.environ["DOCKERFILE_SHA256"],
