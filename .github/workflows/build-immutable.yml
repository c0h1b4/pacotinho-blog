              and material.get("uri", "").startswith("pkg:docker/node")
              and node_digest_qualifier in material.get("uri", "")
              and "platform=linux%2Famd64" in material.get("uri", "")
              and re.fullmatch(r"[0-9a-f]{64}", material.get("digest", {}).get("sha256", ""))
