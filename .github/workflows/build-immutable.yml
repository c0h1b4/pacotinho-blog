              smoke_healthy=true
              break
            fi
            [[ "$(docker container inspect --format '{{.State.Running}}' "${smoke_container}")" == true ]] \
              || break
            sleep 1
          done
          if [[ "${smoke_healthy}" != true ]]; then
            docker container inspect "${smoke_container}" >&2
            docker logs "${smoke_container}" >&2
            exit 1
          fi
          docker rm --force "${smoke_container}" >/dev/null
          smoke_container=
          [[ -z "$(docker ps --all --quiet --filter "name=^/${smoke_name}$")" ]]

          export IMAGE_DIGEST=${image_digest}
          export RELEASE_INDEX_DIGEST=${release_index_digest}
          export ATTESTATION_MANIFEST_DIGEST=${attestation_digest}
          export BUILDX_VERSION=${buildx_version}
          export BUILDKIT_VERSION=${buildkit_version}
          export DOCKER_VERSION=${docker_version}
          PROVENANCE_SHA256="sha256:$(sha256sum provenance.json | cut -d' ' -f1)"
          SBOM_SHA256="sha256:$(sha256sum sbom.json | cut -d' ' -f1)"
          export PROVENANCE_SHA256 SBOM_SHA256
          export BUILD_CONTEXT_SHA256=${build_context_sha256}
          /usr/bin/python3 -I <<'PY'
          import json
          import os

          source_sha = os.environ["SOURCE_SHA"]
          image_digest = os.environ["IMAGE_DIGEST"]
          repository = os.environ["IMAGE_REPOSITORY"]
          manifest = {
              "schema_version": 2,
