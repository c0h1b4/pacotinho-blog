              raise SystemExit("invalid pending release image digest")
          if digest != os.environ["IMAGE_DIGEST"]:
              raise SystemExit("pending release digest does not match verified image")
          if image.get("reference") != f"{os.environ['IMAGE_REPOSITORY']}@{digest}":
              raise SystemExit("invalid digest-qualified image reference")
          if attestations.get("index_digest") != os.environ["RELEASE_INDEX_DIGEST"]:
