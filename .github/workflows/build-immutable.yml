          [[ "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "${image}")" == linux/amd64 ]]
          [[ "$(docker image inspect --format '{{.Config.User}}' "${image}")" == node ]]
          [[ "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.source"}}' "${image}")" == 'https://github.com/c0h1b4/pacotinho-blog' ]]
          [[ "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "${image}")" == "${SOURCE_SHA}" ]]
          [[ "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "${image}")" == "${SOURCE_SHA}" ]]
          [[ "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.created"}}' "${image}")" == "${IMAGE_CREATED}" ]]
          [[ "$(docker image inspect --format '{{index .Config.Labels "io.pacotinho.source.committed-at"}}' "${image}")" == "${SOURCE_COMMITTED_AT}" ]]
          [[ "$(docker image inspect --format '{{index .Config.Labels "io.pacotinho.source.tree"}}' "${image}")" == "${TREE_SHA}" ]]
          [[ "$(docker image inspect --format '{{index .Config.Labels "io.pacotinho.build.identity"}}' "${image}")" == "${BUILD_IDENTITY}" ]]
