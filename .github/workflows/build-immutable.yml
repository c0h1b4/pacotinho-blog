          umask 077
          docker_config=$(mktemp -d)
          cleanup() {
            status=$?
            trap - EXIT
            unset GHCR_TOKEN DOCKER_CONFIG
            rm -rf -- "${docker_config}"
            exit "${status}"
          }
          trap cleanup EXIT
          export DOCKER_CONFIG=${docker_config}

          readarray -t release_values < <(/usr/bin/python3 -I <<'PY'
          import json
          import os
          import re

          with open("release-manifest.pending.json", encoding="utf-8") as handle:
              manifest = json.load(handle)
          if manifest.get("schema_version") != 2:
              raise SystemExit("invalid pending release manifest schema")
          if manifest.get("authoritative") is not False:
              raise SystemExit("pending release manifest must be non-authoritative")
          if manifest.get("repository") != "c0h1b4/pacotinho-blog":
              raise SystemExit("invalid pending release manifest repository")
          source = manifest.get("source", {})
          source_sha = source.get("sha", "")
          workflow = manifest.get("workflow", {})
          build = manifest.get("build", {})
          build_context = build.get("context", {})
          image = manifest.get("image", {})
          tag = image.get("tag", {})
          attestations = manifest.get("attestations", {})
          digest = image.get("digest", "")
          if source_sha != os.environ["SOURCE_SHA"] or not re.fullmatch(r"[0-9a-f]{40}", source_sha):
              raise SystemExit("invalid pending release manifest source")
          if source.get("source_date_epoch") != int(os.environ["SOURCE_DATE_EPOCH"]):
              raise SystemExit("invalid pending release source epoch")
          if workflow.get("run_id") != int(os.environ["GITHUB_RUN_ID"]):
              raise SystemExit("invalid pending release manifest run")
          if workflow.get("run_attempt") != int(os.environ["GITHUB_RUN_ATTEMPT"]):
              raise SystemExit("invalid pending release manifest attempt")
          if build.get("identity") != os.environ["BUILD_IDENTITY"]:
              raise SystemExit("invalid pending release build identity")
          if build_context.get("kind") != "git-archive":
              raise SystemExit("invalid pending release build context kind")
          if build_context.get("storage") != "sealed-linux-memfd":
              raise SystemExit("invalid pending release build context storage")
          if build_context.get("kernel_seals") != ["seal", "shrink", "grow", "write"]:
              raise SystemExit("invalid pending release build context seals")
          if build_context.get("commit") != source_sha:
              raise SystemExit("invalid pending release build context commit")
          if build_context.get("tree") != os.environ["TREE_SHA"]:
              raise SystemExit("invalid pending release build context tree")
          if build_context.get("sha256") != os.environ["BUILD_CONTEXT_SHA256"]:
              raise SystemExit("invalid pending release build context digest")
          if image.get("repository") != os.environ["IMAGE_REPOSITORY"]:
              raise SystemExit("invalid pending release image repository")
          if tag != {
              "name": source_sha,
              "status": "pending",
              "authoritative": False,
              "atomic_create_if_absent": False,
          }:
