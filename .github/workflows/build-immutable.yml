              "repository": os.environ["GITHUB_REPOSITORY"],
              "source": {
                  "sha": source_sha,
                  "tree": os.environ["TREE_SHA"],
                  "committed_at": os.environ["SOURCE_COMMITTED_AT"],
                  "source_date_epoch": int(os.environ["SOURCE_DATE_EPOCH"]),
