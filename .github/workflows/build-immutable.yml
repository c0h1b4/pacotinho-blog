          run_metadata = slsa.get("runDetails", {}).get("metadata", {})
          completeness = run_metadata.get("buildkit_completeness", {})
          if completeness.get("request") is not True:
              raise SystemExit("incomplete SLSA build request")
          if type(completeness.get("resolvedDependencies")) is not bool:
              raise SystemExit("invalid SLSA dependency completeness")
          materials = build_definition.get("resolvedDependencies")
