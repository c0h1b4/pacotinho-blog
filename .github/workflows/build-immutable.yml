          export VERIFIED_TAG_DIGEST=${verified_digest}
          /usr/bin/python3 -I <<'PY'
          import json
          import os

          with open("release-manifest.pending.json", encoding="utf-8") as handle:
              manifest = json.load(handle)
          image = manifest["image"]
          source_sha = manifest["source"]["sha"]
          image["tag"] = {
              "action": os.environ["TAG_ACTION"],
              "name": source_sha,
              "observed_digest": os.environ["VERIFIED_TAG_DIGEST"],
              "reference": f"{image['repository']}:{source_sha}",
              "status": "verified",
              "authoritative": False,
              "atomic_create_if_absent": False,
          }
          manifest["authoritative"] = True
          with open("release-manifest.json", "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY
          rm -f -- release-manifest.pending.json

      - name: Upload authoritative release manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pacotinho-blog-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Clean persistent runner release files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- \
            build-metadata.json image-index.json attestation-manifest.json \
            provenance.json sbom.json \
            release-manifest.pending.json release-manifest.json
