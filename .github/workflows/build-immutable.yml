          if not isinstance(slsa, dict):
              raise SystemExit("missing SLSA provenance predicate")
          build_definition = slsa.get("buildDefinition", {})
          if build_definition.get("buildType") != "https://github.com/moby/buildkit/blob/master/docs/attestations/slsa-definitions.md":
              raise SystemExit("invalid SLSA v1 build type")
          internal_parameters = build_definition.get("internalParameters", {})
          if not isinstance(internal_parameters.get("buildConfig"), dict):
