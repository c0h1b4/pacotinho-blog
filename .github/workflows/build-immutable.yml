              raise SystemExit("invalid SPDX document")
          if not str(spdx.get("spdxVersion", "")).startswith("SPDX-"):
              raise SystemExit("invalid SPDX version")
          if spdx.get("dataLicense") != "CC0-1.0":
              raise SystemExit("invalid SPDX data license")
          creators = spdx.get("creationInfo", {}).get("creators")
