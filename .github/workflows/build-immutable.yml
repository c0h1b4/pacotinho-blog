              --prefer-index=false \
              --tag "${source_tag}" \
              "${image}" >/dev/null
            tag_action=created
          fi

          verified_digest=$(docker buildx imagetools inspect "${source_tag}" \
            --format '{{.Manifest.Digest}}')
          if [[ "${verified_digest}" != "${image_digest}" ]]; then
            printf 'immutable_tag_verification_failed=%s expected=%s actual=%s\n' \
              "${source_tag}" "${image_digest}" "${verified_digest}" >&2
            exit 1
          fi

